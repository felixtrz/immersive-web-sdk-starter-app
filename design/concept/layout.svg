<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -170 400 340" width="1600" height="1360" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Sunny Circuit — top-down layout (1 unit = 1 m, +x right, +z down the page)</title>
  <defs>
    <pattern id="grass" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#6CC04A"/>
      <rect width="10" height="10" fill="#66B845"/>
      <rect x="10" y="10" width="10" height="10" fill="#66B845"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14171C"/>
    </marker>
  </defs>

  <!-- plot -->
  <rect x="-200" y="-170" width="400" height="340" fill="#4FB3F0"/>
  <rect x="-190" y="-152" width="380" height="306" rx="6" fill="url(#grass)"/>
  <text x="-186" y="-157" font-size="7" font-weight="700" fill="#14171C">SUNNY CIRCUIT — TOP-DOWN · plot 380 × 306 m · lap ≈ 980 m · track width 10 m</text>

  <!-- barriers (outer offset of the centerline, drawn as a wide dashed stroke) -->
  <polygon id="centerline-barrier" fill="none" stroke="#2B2B2B" stroke-width="16" stroke-linejoin="round" stroke-dasharray="3 2"
    points="-81,108 81,108 148,81 169,27 148,-27 81,-40 40,-81 54,-121 0,-135 -81,-121 -148,-81 -175,-13 -162,54 -135,94"/>
  <!-- curbs -->
  <polygon fill="none" stroke="#E5483B" stroke-width="12" stroke-linejoin="round"
    points="-81,108 81,108 148,81 169,27 148,-27 81,-40 40,-81 54,-121 0,-135 -81,-121 -148,-81 -175,-13 -162,54 -135,94"/>
  <polygon fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" stroke-dasharray="4 4"
    points="-81,108 81,108 148,81 169,27 148,-27 81,-40 40,-81 54,-121 0,-135 -81,-121 -148,-81 -175,-13 -162,54 -135,94"/>
  <!-- asphalt -->
  <polygon fill="none" stroke="#6B6660" stroke-width="10" stroke-linejoin="round"
    points="-81,108 81,108 148,81 169,27 148,-27 81,-40 40,-81 54,-121 0,-135 -81,-121 -148,-81 -175,-13 -162,54 -135,94"/>
  <!-- centerline -->
  <polygon fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.7"
    points="-81,108 81,108 148,81 169,27 148,-27 81,-40 40,-81 54,-121 0,-135 -81,-121 -148,-81 -175,-13 -162,54 -135,94"/>

  <!-- direction arrows -->
  <line x1="20" y1="108" x2="50" y2="108" stroke="#14171C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="-30" y1="-128" x2="-55" y2="-124" stroke="#14171C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- start/finish line = CP0 -->
  <rect x="-1.5" y="103" width="3" height="10" fill="#FFFFFF"/>
  <rect x="-1.5" y="103" width="1.5" height="2.5" fill="#14171C"/>
  <rect x="0" y="105.5" width="1.5" height="2.5" fill="#14171C"/>
  <rect x="-1.5" y="108" width="1.5" height="2.5" fill="#14171C"/>
  <rect x="0" y="110.5" width="1.5" height="2.5" fill="#14171C"/>
  <text x="0" y="124" font-size="6" text-anchor="middle" fill="#14171C" font-weight="700">CP0 start/finish (0, 108)</text>

  <!-- grid / player start -->
  <rect x="-14" y="105.4" width="1.8" height="1.2" transform="rotate(0)" fill="#F28C28" stroke="#14171C" stroke-width="0.3"/>
  <text x="-14" y="98" font-size="5" text-anchor="middle" fill="#14171C">Kart spawn (-14, 0, 108)</text>
  <text x="-14" y="92" font-size="5" text-anchor="middle" fill="#14171C">facing +x (yaw −90°)</text>

  <!-- gantry -->
  <rect x="-2" y="100" width="4" height="16" fill="none" stroke="#14171C" stroke-width="0.6"/>

  <!-- checkpoints -->
  <g font-size="6" font-weight="700" fill="#14171C">
    <line x1="160" y1="27" x2="178" y2="27" stroke="#F28C28" stroke-width="2"/>
    <text x="182" y="29">CP1</text>
    <line x1="0" y1="-144" x2="0" y2="-126" stroke="#F28C28" stroke-width="2"/>
    <text x="0" y="-147" text-anchor="middle">CP2</text>
    <line x1="-184" y1="-13" x2="-166" y2="-13" stroke="#F28C28" stroke-width="2"/>
    <text x="-186" y="-17" text-anchor="end">CP3</text>
  </g>

  <!-- shortcut test (S6) -->
  <line x1="40" y1="-60" x2="40" y2="100" stroke="#14171C" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="44" y="20" font-size="5" fill="#14171C">S6 shortcut test path (skips CP1)</text>

  <!-- scenery (target tier) -->
  <rect x="-60" y="122" width="50" height="10" fill="#E9E4DA" stroke="#14171C" stroke-width="0.4"/>
  <text x="-35" y="141" font-size="5" text-anchor="middle" fill="#14171C">Grandstand (target)</text>
  <g fill="#3E8E3A">
    <circle cx="-40" cy="20" r="6"/><circle cx="-20" cy="40" r="5"/><circle cx="10" cy="0" r="7"/>
    <circle cx="90" cy="20" r="5"/><circle cx="-100" cy="10" r="6"/><circle cx="-80" cy="-40" r="5"/>
  </g>
  <g fill="#F28C28">
    <polygon points="120,72 122,77 118,77"/><polygon points="126,66 128,71 124,71"/>
    <polygon points="70,-50 72,-45 68,-45"/>
  </g>
  <text x="128" y="62" font-size="4.5" fill="#14171C">cones (M4)</text>

  <!-- corner labels -->
  <g font-size="5" fill="#14171C" opacity="0.8">
    <text x="170" y="80">T1 fast right</text>
    <text x="90" y="-48">T3 hairpin</text>
    <text x="60" y="-128">T4</text>
    <text x="-150" y="-95">T5 long sweeper</text>
    <text x="-185" y="70">T6</text>
  </g>

  <!-- scale bar -->
  <g transform="translate(110,140)">
    <rect x="0" y="0" width="50" height="3" fill="#14171C"/>
    <rect x="0" y="0" width="25" height="3" fill="#FFFFFF" stroke="#14171C" stroke-width="0.3"/>
    <text x="0" y="10" font-size="5" fill="#14171C">0</text>
    <text x="25" y="10" font-size="5" text-anchor="middle" fill="#14171C">25</text>
    <text x="50" y="10" font-size="5" text-anchor="end" fill="#14171C">50 m</text>
  </g>

  <!-- cockpit inset (separate scale: 1 unit = 1 cm, side view) -->
  <g transform="translate(-60,-30)">
    <rect x="0" y="0" width="120" height="84" rx="3" fill="#FFFFFF" opacity="0.92" stroke="#14171C" stroke-width="0.5"/>
    <text x="4" y="8" font-size="5" font-weight="700" fill="#14171C">Cockpit — side view (kart-local, meters)</text>
    <g transform="translate(10,74) scale(50)">
      <!-- ground -->
      <line x1="-0.1" y1="0" x2="1.9" y2="0" stroke="#14171C" stroke-width="0.01"/>
      <!-- chassis -->
      <rect x="0" y="-0.25" width="1.8" height="0.15" fill="#F28C28"/>
      <circle cx="0.25" cy="-0.13" r="0.13" fill="#2B2B2B"/>
      <circle cx="1.55" cy="-0.13" r="0.13" fill="#2B2B2B"/>
      <!-- seat + driver head -->
      <rect x="0.35" y="-0.65" width="0.12" height="0.4" fill="#2B2B2B"/>
      <circle cx="0.6" cy="-0.95" r="0.1" fill="none" stroke="#14171C" stroke-width="0.015"/>
      <!-- wheel -->
      <line x1="1.0" y1="-0.75" x2="1.08" y2="-0.45" stroke="#14171C" stroke-width="0.03"/>
      <!-- dash -->
      <rect x="1.1" y="-0.6" width="0.06" height="0.14" fill="#14171C"/>
    </g>
    <g font-size="3.6" fill="#14171C">
      <text x="44" y="20">head/eye ≈ (0, 0.95, 0) — rig origin</text>
      <text x="58" y="34">wheel center (0, 0.68, −0.42), Ø 0.32 m</text>
      <text x="64" y="48">dash panel (0, 0.53, −0.55), 0.30 × 0.12 m</text>
      <text x="6" y="80">kart 1.8 × 1.2 m · seat (0, 0.3, 0.1)</text>
    </g>
  </g>
</svg>
